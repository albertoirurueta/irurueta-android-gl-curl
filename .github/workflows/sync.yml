name: Sync

# After a release is published from main, open a pull request that merges it back into
# develop and bumps the development -SNAPSHOT version, so develop never has to wait
# for a manual sync branch. The next version is the one planned in the release's
# README ("Current development version"), or a patch bump when none is planned.
on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open sync PR from the released branch into develop
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Compute versions and branch names
        id: versions
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION

          # Uses the planned next version recorded in the released README's "Current development version"
          # row when it is newer than the release (a planned minor/major bump); otherwise bumps the patch.
          NEXT_SNAPSHOT="$(python3 .github/scripts/sync_versions.py --print-next-snapshot)"
          SYNC_BRANCH="sync_${RELEASE_VERSION}"
          echo "::notice::Released ${RELEASE_VERSION}; develop will move to ${NEXT_SNAPSHOT}."

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$NEXT_SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Skip if this release was already synced
        id: guard
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${{ steps.versions.outputs.sync_branch }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.versions.outputs.sync_branch }} already exists on origin; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.guard.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch from develop
        if: steps.guard.outputs.exists == 'false'
        run: |
          git fetch origin develop main
          git checkout -b "${{ steps.versions.outputs.sync_branch }}" "origin/develop"

      - name: Merge the released branch into the sync branch
        id: merge
        if: steps.guard.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          SYNC_BRANCH: ${{ steps.versions.outputs.sync_branch }}
        run: |
          if git merge --no-ff --no-edit \
              -m "Merge main (${RELEASE_VERSION}) into develop" \
              "origin/main"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "::warning::Merging main (${RELEASE_VERSION}) into develop conflicts; opening the sync pull request from the release commit for manual resolution, without bumping the development version."
            git checkout -B "${SYNC_BRANCH}" "origin/main"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the development snapshot version
        if: steps.guard.outputs.exists == 'false' && steps.merge.outputs.conflict == 'false'
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          NEXT_SNAPSHOT: ${{ steps.versions.outputs.next_snapshot }}
        run: python3 .github/scripts/sync_versions.py

      - name: Commit the version bump
        if: steps.guard.outputs.exists == 'false' && steps.merge.outputs.conflict == 'false'
        run: |
          # --ignore-errors keeps a missing README/docs tree (or module) from aborting the step with
          # "fatal: pathspec ... did not match any files"; whatever does exist is staged.
          git add --ignore-errors -- lib/build.gradle.kts app/build.gradle.kts README.md docs/antora.yml docs/modules/ROOT/pages || true
          git diff --cached --quiet || git commit -m "Sync ${{ steps.versions.outputs.next_snapshot }}"

      - name: Push sync branch
        if: steps.guard.outputs.exists == 'false'
        run: git push origin "${{ steps.versions.outputs.sync_branch }}"

      - name: Ensure the sync label exists
        if: steps.guard.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sync --description "Sync pull request from a release branch back into develop" --color 0e8a16 \
            || gh label list --search sync >/dev/null

      - name: Open pull request into develop
        if: steps.guard.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          NEXT_SNAPSHOT: ${{ steps.versions.outputs.next_snapshot }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          if [ "${CONFLICT}" = "true" ]; then
            TITLE="Sync ${RELEASE_VERSION} (merge conflicts to resolve)"
            BODY="Merges \`main\` (\`${RELEASE_VERSION}\`) back into \`develop\`. The automatic merge conflicted (usually on the version line), so this branch points at the release commit and the development version was **not** bumped. Resolve the conflicts keeping \`develop\`'s development version and taking the release's changes otherwise."
          else
            TITLE="Sync ${NEXT_SNAPSHOT}"
            BODY="Merges \`main\` back into \`develop\` after releasing \`${RELEASE_VERSION}\`, and bumps the development version to \`${NEXT_SNAPSHOT}\` in \`lib/build.gradle.kts\`/\`app/build.gradle.kts\`, \`README.md\`, and the Antora docs."
          fi
          gh pr create \
            --base develop \
            --head "${{ steps.versions.outputs.sync_branch }}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            --label sync
