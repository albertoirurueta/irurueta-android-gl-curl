version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    # gitflow: updates go through develop, never straight to main (the release branch)
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    # gitflow: updates go through develop, never straight to main (the release branch)
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
